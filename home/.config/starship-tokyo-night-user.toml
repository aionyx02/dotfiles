"$schema" = "https://starship.rs/config-schema.json"

format = """
[░▒▓](#a3aed2)\
$os\
[](bg:#769ff0 fg:#a3aed2)\
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$nodejs\
$bun\
$conda\
$python\
$rust\
$golang\
$java\
$php\
[](fg:#212736 bg:#1d2230)\
$time\
[ ](fg:#1d2230)\
$line_break\
$character"""
# scan_timeout：判斷目錄應啟用哪些模組時，檔案掃描的時間上限。
#   官方預設為 30ms；若設為 1000，在檔案快取未命中的大型目錄中最多會等待 1 秒。
# command_timeout：呼叫外部指令（git、node --version、rustc -V 等）的時間上限。
#   本機啟用 Defender 即時保護，每次啟動 exe 至少約需 37ms；
#   在大型 repo 中 starship 需連續執行 4 次 git，快取未命中時實測整個 prompt 需 3.7 秒。
#   設為 500ms 的代價是逾時的那一次不顯示 git 狀態，而不會讓整個 shell 卡住。
scan_timeout = 100
command_timeout = 500

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#394260"
format = "[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)"
truncation_length = 28
truncation_symbol = "…"

[git_status]
# 使用中的 repo 皆沒有 submodule，因此略過 submodule 掃描
ignore_submodules = true
style = "bg:#394260"
format = "[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)"

[nodejs]
symbol = ""
style = "bg:#212736"
format = "[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)"

# 本機未安裝 bun、go、php，停用這些模組可省去每次進入專案目錄時的偵測。
# format 字串中的 $bun、$golang、$php 可保留，停用的模組會顯示為空字串，外觀不變。
[bun]
disabled = true
symbol = ""
style = "bg:#212736"
format = "[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)"

# starship 會接管整個 prompt，conda hook 原本加在 prompt 前的 (env) 會被蓋掉，
# 必須靠此模組顯示。ignore_base = false：base 也顯示，才看得出 conda 有沒有啟用。
# symbol 不可用 starship 預設的 🅒（U+1F152）：WezTerm 的字型後援鏈裡沒有任何字型含此字，
# 會落到系統後援或顯示成方框，寬度也不固定而把後面的色塊擠歪。改用 Nerd Font 的 dev-anaconda。
[conda]
symbol = ""
ignore_base = false
style = "bg:#212736"
format = "[[ $symbol $environment ](fg:#9ece6a bg:#212736)]($style)"

[python]
symbol = ""
style = "bg:#212736"
format = "[[ $symbol ($version)( $virtualenv) ](fg:#7dcfff bg:#212736)]($style)"

[rust]
symbol = ""
style = "bg:#212736"
format = "[[ $symbol ($version) ](fg:#ff9e64 bg:#212736)]($style)"

[golang]
disabled = true
symbol = ""
style = "bg:#212736"
format = "[[ $symbol ($version) ](fg:#73daca bg:#212736)]($style)"

[java]
symbol = ""
style = "bg:#212736"
format = "[[ $symbol ($version) ](fg:#f7768e bg:#212736)]($style)"

[php]
disabled = true
symbol = ""
style = "bg:#212736"
format = "[[ $symbol ($version) ](fg:#bb9af7 bg:#212736)]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:#1d2230"
format = "[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)"

[os]
style = "bg:#a3aed2 fg:#090c0c"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

