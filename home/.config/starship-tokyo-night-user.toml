"$schema" = "https://starship.rs/config-schema.json"

format = """
[░▒▓](#a3aed2)\
$os\
[](bg:#769ff0 fg:#a3aed2)\
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$nodejs\
$bun\
$python\
$rust\
$golang\
$java\
$php\
[](fg:#212736 bg:#1d2230)\
$time\
[ ](fg:#1d2230)\
$line_break\
$character"""
# scan_timeout：偵測「這個目錄該啟用哪些模組」的檔案掃描上限。
#   官方預設 30ms，原本設 1000 等於在冷檔案快取的大目錄裡最多可以卡滿 1 秒才放棄。
# command_timeout：呼叫外部指令(git / node --version / rustc -V …)的上限。
#   這台機器 Defender 即時防護開著，光是 spawn 一個 exe 的底價就 ~37ms，
#   在大 repo 裡 starship 要連續 spawn 4 次 git，冷快取時實測整個 prompt 要 3.7 秒。
#   壓到 500ms 的代價：那一次不顯示 git 狀態（而非整個 shell 卡住）。
scan_timeout = 100
command_timeout = 500

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#394260"
format = "[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)"
truncation_length = 28
truncation_symbol = "…"

[git_status]
# 這幾個 repo 都沒有 submodule，直接跳過 submodule 掃描
ignore_submodules = true
style = "bg:#394260"
format = "[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)"

[nodejs]
symbol = ""
style = "bg:#212736"
format = "[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)"

# 未安裝(實測 Get-Command 找不到 bun / go / php)，關掉可省下每次進入專案目錄的偵測。
# format 字串裡的 $bun / $golang / $php 保留即可 —— 停用的模組渲染成空字串，外觀不變。
[bun]
disabled = true
symbol = ""
style = "bg:#212736"
format = "[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)"

[python]
symbol = ""
style = "bg:#212736"
format = "[[ $symbol ($version)( $virtualenv) ](fg:#7dcfff bg:#212736)]($style)"

[rust]
symbol = ""
style = "bg:#212736"
format = "[[ $symbol ($version) ](fg:#ff9e64 bg:#212736)]($style)"

[golang]
disabled = true
symbol = ""
style = "bg:#212736"
format = "[[ $symbol ($version) ](fg:#73daca bg:#212736)]($style)"

[java]
symbol = ""
style = "bg:#212736"
format = "[[ $symbol ($version) ](fg:#f7768e bg:#212736)]($style)"

[php]
disabled = true
symbol = ""
style = "bg:#212736"
format = "[[ $symbol ($version) ](fg:#bb9af7 bg:#212736)]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:#1d2230"
format = "[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)"

[os]
style = "bg:#a3aed2 fg:#090c0c"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

