# =====================================================================
#  Yazi 鍵位
#
#  分為三區，用途各自獨立，可個別刪除：
#    1. 外掛與行為覆寫：外掛所需的鍵位，覆寫 l、<Enter>、f、p、h、<Left>、s、S 等
#    2. Leader 群組    ：以 ` 開頭的組合鍵，忘記鍵位時可由此查詢
#    3. Windows 功能鍵 ：F2、F3、F4、F5、Delete、Backspace，對應檔案總管的使用習慣
#
#  原則：自訂鍵位只使用原生單鍵與 Windows 功能鍵，不使用任何 Ctrl 組合鍵。
#
#    每個動作只保留一個直接鍵位，leader 群組作為查詢用途。
#    同一動作有多個入口（例如複製可按 y、<C-c> 或 `y）時，
#    每次操作前都得先決定要按哪個，反而增加負擔。
#
#    因此不綁定：<C-c>（複製）、<C-x>（剪下）、<C-v>（貼上）、<S-Delete>（永久刪除）、
#                <C-f>（過濾）、<C-p>（fzf）、`z（fzf）
#    其中前四個各有額外問題：<C-c> 會佔用預設的關閉分頁；<C-v> 需要 wezterm.lua
#    特別放行；<S-Delete> 依賴 kitty keyboard protocol，不保證能傳到 yazi。
#    不綁定後，<C-c> 與 <C-f> 皆維持 yazi 的預設行為。
#
#  leader 群組不算重複入口：它是查詢表，只在忘記鍵位時使用，不與直接鍵位競爭。
#    內建的 ~ 說明有 110 行英文，作為查詢表過於冗長。
#
#  限制：以下按鍵會被 WezTerm 攔截，無法傳到 yazi，不可使用：
#    Alt+hjkl、Alt+Shift+hjkl、Alt+方向鍵、Ctrl+1～9、Ctrl+Tab、
#    Alt+[、Alt+]、Alt+z、Alt+w、Ctrl+Shift+{t,w,c,v,p,b}、Ctrl+Shift+Space、
#    Ctrl+Insert、Shift+Insert、Ctrl+V
#    （toggle-pane 的 README 範例綁定 Ctrl+1/2/3，在此環境下不會有反應。）
#
#  Ctrl+C 會依條件傳入：wezterm.lua 的 action_callback 在終端機有選取文字時複製，
#    沒有選取時才將 Ctrl+C 傳給 yazi。此處未綁定 <C-c>，因此會執行 yazi 預設的關閉分頁。
#
#  以下為內建鍵位，不需在此設定：
#    z = fzf   Z = zoxide   r = 重新命名   a = 新建檔案／目錄
#    O = 選擇開啟方式   . = 切換隱藏檔   w = 背景工作   / = 尋找下一個
#    y = 複製   x = 剪下   d = 刪除   D = 永久刪除
#    <Tab> = 檔案詳細資訊（spot）   <C-a> = 全選   q = 離開
#    <C-c> = 關閉分頁   <C-f> = 下一頁   g<Space> = 輸入路徑跳轉   gh = 家目錄
#    tt = 新分頁   tr = 重新命名分頁   1～9 = 切換分頁   [ ] = 相鄰分頁
#    cc/cd/cf/cn = 複製路徑／目錄／檔名／主檔名   , + 鍵 = 排序   m + 鍵 = linemode
#
#  v26.5.6 沒有以下功能（已對照 v26.5.6 的 yazi-config/preset/ 確認）：
#      A = 批次建立檔案 → bulk_create 指令在 26.5.6 尚不存在（僅 main 分支有）
#      gt = 資源回收筒  → 預設鍵位中沒有 g 開頭的回收筒綁定
#      opener.trash     → 預設 opener 只有 edit、play、open、reveal、extract、download
#    注意：main 分支已將 gt 綁定為 `plugin trash`，升級後須重新確認。
# =====================================================================

# l / Enter：目錄則進入，檔案則開啟。取代預設的 enter 與 open。
[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "進入子目錄，或開啟檔案"

[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "進入子目錄，或開啟檔案"

# f：取代預設的 filter --smart。
# 額外功能：過濾到只剩一個目錄時，自動進入該目錄並繼續過濾，
# 適合在 src/a/b/c 這類深層路徑中移動。與 fzf（z）的使用情境不同：
# 此功能逐層確認，fzf 則一次跳到目標。
#
# 前置的 "arrow top" 用於修正錯誤，不可移除。
#   filter_do 套用過濾後會呼叫 Folder::hover() 嘗試停留在原本的檔案；
#   若該檔案已被濾除，程式碼為 entries.position(key).unwrap_or(self.cursor)，
#   即保留原本的索引，再限制在清單長度內。
#   例如按 f 前停在第 8 筆、過濾後剩 4 筆，游標會落在第 4 筆（最後一筆），
#   而 smart-filter 的 Enter 開啟的是游標所在項目，結果總是開啟最後一筆。
#
#   過濾中無法移動游標，原因是按鍵綁定到了其他功能：
#     [input] 預設將 <Up> / <Down> 綁定為 recall -1 / recall 1（回溯輸入歷史），
#     而 smart-filter 以 ya.input 開啟的輸入框沒有歷史可回溯，
#     指令雖有執行但沒有效果，看起來就像按鍵無作用。
#   改為移動檔案游標確實無法實現（已對照 yazi-fm/src/executor.rs 確認）：
#     arrow 是 mgr 層指令，綁定在 [input] 會被忽略；plugin 指令只在
#     InputMode::Normal 時派送，Insert 模式僅處理 complete，
#     而輸入框開啟時即為 Insert 模式，因此也無法以外掛繞過。
#   官方 issue #2991 已以 not planned 關閉。
#   需要「輸入以縮小清單並上下比較」時使用下方的 F；需要「輸入時同時上下選擇」時使用
#   <F4>（Everything），它透過 fzf 執行，是獨立行程，有自己的鍵盤處理，方向鍵可正常使用。
#
#   先跳到頂端可將索引固定為 0：無論頂端項目是否被濾除，游標都會落在
#   第一個符合的項目，且每多輸入一個字元皆成立，
#   效果與 fzf 的「游標固定在第一筆」相同，Enter 開啟的即是該項目。
[[mgr.prepend_keymap]]
on   = "f"
run  = [ "arrow top", "plugin smart-filter" ]
desc = "智慧過濾：游標釘在第一筆、唯一目錄自動進入"

# F：保留內建的過濾功能，與 f 互補。
#   f = 輸入時即時縮小清單，Enter 直接開啟第一筆    → 目標明確時使用
#   F = Enter 只關閉輸入框，過濾持續生效            → 需要上下比較剩餘項目時使用
#       此時 j、k、l 與方向鍵皆可正常使用，也能選取最上面的項目，<Esc> 清除過濾。
# smart-filter 沒有這種模式，這也是前述無法選取最上面項目的原因。
#
# 此處的 "arrow top" 與 f 的理由相同：filter_do 會保留原本的索引並限制在清單長度內，
#   若不先跳到頂端，套用過濾後游標同樣會落在最後一筆。兩者須一致設定。
[[mgr.prepend_keymap]]
on   = "F"
run  = [ "arrow top", "filter --smart" ]
desc = "內建過濾：套用後可自由上下瀏覽"

# s / S：鍵位與預設相同，僅補上搜尋引擎的參數。
#
# 覆寫原因：fd 與 rg 的預設值較保守，會略過隱藏檔並完全遵守 .gitignore。
#   在有 .gitignore 的專案中會遺漏大量結果，
#   最常遺漏的是 .env、.github/、.vscode/ 等經常需要搜尋的檔案。
#
# 加上 --hidden 時必須同時排除 .git，否則 fd 會搜尋 .git/objects，
#   產生數千筆無用結果。
#
# 不加 --no-ignore：搜尋磁碟上所有檔案的需求由 <F4>（Everything）處理。
#   s 用於專案內搜尋，遵守 .gitignore 可避免 node_modules 等目錄淹沒結果。
#
# 這兩個鍵位涵蓋 Everything 無法處理的情況，必須保留：
#     s：Everything 讀取 NTFS 的 MFT，無法看到 \\wsl.localhost 的 ext4，
#        在 WSL 中這是唯一的檔名搜尋方式
#     S：Everything 只搜尋檔名，不比對檔案內容
[[mgr.prepend_keymap]]
on   = "s"
run  = "search --via=fd --args='--hidden --follow --exclude .git'"
desc = "遞迴搜檔名 (fd，含隱藏檔)"

[[mgr.prepend_keymap]]
on   = "S"
run  = "search --via=rg --args='--hidden --glob=!.git'"
desc = "遞迴搜內容 (ripgrep，含隱藏檔)"

# p：取代預設的 paste。貼到游標所在的目錄而非目前目錄，
# 省去「進入目錄、貼上、返回」三個步驟。
[[mgr.prepend_keymap]]
on   = "p"
run  = "plugin smart-paste"
desc = "貼上到游標所在目錄"

# h / <Left>：取代預設的 leave。
# 只在已位於 C:\ 等最上層時有差異：預設無反應，此處改為開啟磁碟機選單。
# 在其他目錄中的行為與預設相同。
[[mgr.prepend_keymap]]
on   = "h"
run  = "plugin smart-leave"
desc = "回上層目錄，已到頂則切換磁碟機"

[[mgr.prepend_keymap]]
on   = "<Left>"
run  = "plugin smart-leave"
desc = "回上層目錄，已到頂則切換磁碟機"

# M：yazi 預設未使用此鍵。官方 mount 外掛的 README 也建議綁定此鍵，
# 日後若在 WSL 中使用 mount，可沿用相同的鍵位。
# 不需先回到最上層，在任何目錄深度都能直接切換磁碟機。
[[mgr.prepend_keymap]]
on   = "M"
run  = "plugin drives"
desc = "磁碟機 / WSL 切換選單"

# T：yazi 預設未使用此鍵。
# 使用 max-preview 而非 min-preview：目的是將預覽擴展為全寬以檢視大圖，而非隱藏預覽。
# 再按一次恢復為 ratio 設定的比例。
[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "預覽窗全寬 / 還原"

# !：yazi 預設未使用此鍵，官方 tips 亦建議綁定此鍵。
# 與內建的 ;（shell --interactive）及 :（shell --block --interactive）不同：
# 後兩者執行一條指令後即返回，此鍵則在目前目錄開啟完整的 shell，
# 適合連續執行多條指令。exit 後自動返回 yazi。
# 使用 pwsh 而非 powershell.exe：本機安裝的是 PowerShell 7.6，官方範例中的
# powershell.exe 會開啟 Windows 內建的 5.1。
[[mgr.prepend_keymap]]
on   = "!"
for  = "windows"
run  = 'shell "pwsh" --block'
desc = "在此目錄開一個 PowerShell"

[[mgr.prepend_keymap]]
on   = "!"
for  = "unix"
run  = 'shell "$SHELL" --block'
desc = "在此目錄開一個 shell"


# =====================================================================
#  Leader 群組（` 反引號）
#
#  用途：mgr 層預設有 110 個鍵位，其中 31 個是組合鍵（g*、c*、m*、,*、t*），
#    按下第一個鍵後 yazi 會自動顯示 which-key 候選清單，因此不需記憶；
#    其餘 79 個單鍵才需要記憶。
#    本區將常用動作也設為組合鍵，利用相同的 which-key 機制，
#    將需要記憶的鍵位從 79 個減少為 1 個：忘記時按 ` 即可查詢。
#
#  本區只新增鍵位，不修改任何預設鍵位：
#    熟悉的人使用直接鍵位（d 刪除），忘記時使用 leader（`d），兩者並存。
#    不需要時可刪除整區，不影響其他設定。
#
#  選用 ` 的原因：mgr 層未使用、不需按 Shift、位於鍵盤左上角容易按到。
#    不使用 ' 是因為書籤類外掛（yamb、bunny）慣例綁定在 ' 上。
#    若要更換 leader，將本區所有的 "`" 取代即可。
#
#  which-key 候選清單的排序由 [which] sort_by 決定，預設 "none"
#    即依此處的定義順序顯示，因此以下依「尋找、檢視、修改、前往、其他」分組。
# =====================================================================

# --- 尋找 -------------------------------------------------------------
[[mgr.prepend_keymap]]
on   = [ "`", "f" ]
run  = [ "arrow top", "plugin smart-filter" ]
desc = "過濾：游標釘第一筆，Enter 直接開"

[[mgr.prepend_keymap]]
on   = [ "`", "F" ]
run  = [ "arrow top", "filter --smart" ]
desc = "過濾：套用後可自由上下瀏覽"

[[mgr.prepend_keymap]]
on   = [ "`", "e" ]
run  = "plugin everything"
desc = "全機搜檔名 (Everything，即時)"

[[mgr.prepend_keymap]]
on   = [ "`", "s" ]
run  = "search --via=fd --args='--hidden --follow --exclude .git'"
desc = "遞迴搜檔名 (fd，含隱藏檔)"

[[mgr.prepend_keymap]]
on   = [ "`", "S" ]
run  = "search --via=rg --args='--hidden --glob=!.git'"
desc = "遞迴搜內容 (ripgrep，含隱藏檔)"

[[mgr.prepend_keymap]]
on   = [ "`", "/" ]
run  = "find --smart"
desc = "只跳游標不縮清單（n / N 找下一個）"

# --- 檢視 -------------------------------------------------------------
[[mgr.prepend_keymap]]
on   = [ "`", "i" ]
run  = "spot"
desc = "檔案詳細資訊"

[[mgr.prepend_keymap]]
on   = [ "`", "." ]
run  = "hidden toggle"
desc = "切換隱藏檔"

[[mgr.prepend_keymap]]
on   = [ "`", "T" ]
run  = "plugin toggle-pane max-preview"
desc = "預覽窗全寬 / 還原"

[[mgr.prepend_keymap]]
on   = [ "`", "w" ]
run  = "tasks:show"
desc = "背景工作清單"

# --- 修改 -------------------------------------------------------------
[[mgr.prepend_keymap]]
on   = [ "`", "a" ]
run  = "create"
desc = "新建檔案 / 目錄（結尾加 / 就是目錄）"

[[mgr.prepend_keymap]]
on   = [ "`", "r" ]
run  = "rename --cursor=before_ext"
desc = "改名（游標停在副檔名前）"

[[mgr.prepend_keymap]]
on   = [ "`", "y" ]
run  = "yank"
desc = "複製"

[[mgr.prepend_keymap]]
on   = [ "`", "x" ]
run  = "yank --cut"
desc = "剪下"

[[mgr.prepend_keymap]]
on   = [ "`", "p" ]
run  = "plugin smart-paste"
desc = "貼上到游標所在目錄"

[[mgr.prepend_keymap]]
on   = [ "`", "d" ]
run  = "remove"
desc = "刪除（進回收桶）"

[[mgr.prepend_keymap]]
on   = [ "`", "D" ]
run  = "remove --permanently"
desc = "永久刪除（不進回收桶）"

[[mgr.prepend_keymap]]
on   = [ "`", "o" ]
run  = "open --interactive"
desc = "選擇用什麼程式開啟"

# --- 前往 -------------------------------------------------------------
[[mgr.prepend_keymap]]
on   = [ "`", "g" ]
run  = "cd --interactive"
desc = "輸入路徑跳過去"

[[mgr.prepend_keymap]]
on   = [ "`", "h" ]
run  = "cd ~"
desc = "回家目錄"

[[mgr.prepend_keymap]]
on   = [ "`", "M" ]
run  = "plugin drives"
desc = "磁碟機 / WSL 切換選單"

[[mgr.prepend_keymap]]
on   = [ "`", "Z" ]
run  = "plugin zoxide"
desc = "zoxide 跳到常去的目錄"

# --- 其他 -------------------------------------------------------------
[[mgr.prepend_keymap]]
on   = [ "`", "!" ]
run  = 'shell "pwsh" --block'
for  = "windows"
desc = "在此目錄開一個 PowerShell"

[[mgr.prepend_keymap]]
on   = [ "`", "?" ]
run  = "help"
desc = "完整鍵位表（開啟後按 f 可以過濾）"

# 僅作為查詢表項目；<C-c> 已是預設的關閉分頁。
[[mgr.prepend_keymap]]
on   = [ "`", "q" ]
run  = "close"
desc = "關閉分頁（最後一個分頁則離開 yazi）"


# =====================================================================
#  Windows 功能鍵
#
#  用途：yazi 的鍵位採用 vim 慣例（y = yank、d = delete、x = cut、hjkl = 方向），
#    對不熟悉 vim 的使用者而言，會與既有的操作習慣衝突。
#    本區加入檔案總管的慣用鍵位，不需學習新操作。
#
#  只使用功能鍵與 <Backspace>，不使用 Ctrl 組合鍵。
#    這些鍵在 v26.5.6 的 mgr 層皆未使用（已逐一對照），
#    功能鍵在終端機中也沒有編碼歧義，不需要 kitty keyboard protocol。
#    不綁定 <C-c>、<C-x>、<C-v>、<S-Delete> 的原因見檔案開頭的說明。
#    <C-a> 預設即為全選，與 Windows 一致，不需修改。
#
#  功能鍵依序排列：F2 重新命名、F3 在目前目錄搜尋、F4 全機搜尋、F5 重新整理。
# =====================================================================

# --- 導航 -------------------------------------------------------------
# 與檔案總管相同，Backspace 回到上一層。使用與 h / <Left> 相同的外掛，行為一致。
[[mgr.prepend_keymap]]
on   = "<Backspace>"
run  = "plugin smart-leave"
desc = "上一層目錄"

# --- 檔案操作 ---------------------------------------------------------
[[mgr.prepend_keymap]]
on   = "<F2>"
run  = "rename --cursor=before_ext"
desc = "改名"

[[mgr.prepend_keymap]]
on   = "<Delete>"
run  = "remove"
desc = "刪除（進回收桶）"

# 永久刪除請使用預設的 D 或 `D。不綁定 <S-Delete>：
# 它能否傳到 yazi 取決於終端機是否啟用 kitty keyboard protocol，
# 無法保證可用，而 D 沒有這個問題。

# --- 搜尋 -------------------------------------------------------------
# F3：與 f 相同的指令，對應 Windows 的搜尋習慣。
# 不綁定 <C-f>，以保留預設的「下一頁」（與 <PageDown> 相同）。
[[mgr.prepend_keymap]]
on   = "<F3>"
run  = [ "arrow top", "plugin smart-filter" ]
desc = "在這一層找檔案"

# F4：全機檔名搜尋。F3 搜尋目前目錄，F4 擴大到全機，兩者順序連貫。
#
# 底層為 voidtools Everything，而非傳統索引：它直接讀取 NTFS 的 MFT，
#   並訂閱 USN journal，因此不需重建索引，檔案建立後即可搜尋到，
#   查詢僅需數毫秒。因此可以在每輸入一個字元時重新執行全機查詢。
#
# 需要以下兩個 winget 套件：
#     voidtools.Everything       主程式（含服務，負責讀取 MFT，必須常駐）
#     voidtools.Everything.Cli   es.exe，命令列介面
#   服務未執行時，es 回傳 errorlevel 8 且沒有任何輸出；
#   外掛會偵測此情況並明確顯示錯誤，避免誤以為是搜尋不到結果。
#
# Everything 無法搜尋 \\wsl.localhost 的 ext4，也不比對檔案內容，
#   這兩種情況由 s（fd）與 S（rg）處理，因此這兩個鍵位必須保留。
[[mgr.prepend_keymap]]
on   = "<F4>"
run  = "plugin everything"
desc = "全機搜檔名（Everything，即時）"

# --- 其他 -------------------------------------------------------------
[[mgr.prepend_keymap]]
on   = "<F5>"
run  = "refresh"
desc = "重新整理"
