# =====================================================================
#  Yazi 主題
#  搭配 WezTerm 的 Tokyo Night (#1a1b26)。
#
#  ★ 為什麼這個 flavor 不會破壞毛玻璃：
#    你的 WezTerm 設了 window_background_opacity = 0.90。
#    tokyo-night 的主檔案區(mgr)全部使用 bg = "reset"，也就是不畫背景、
#    直接讓終端機背景透出來 → 90% 透明完整保留。
#    只有分頁標籤與進度條有實色背景(#292e42 / #7aa2f7)，
#    而那正好是 WezTerm 分頁膠囊用的同一組藍，視覺會接上。
#
#  只設 dark：WezTerm 是深色底，用不到 light。
#  (flavor README 裡的 use = "..." 是 Yazi 0.4 之前的舊鍵，本機 26.5.6 不需要。)
# =====================================================================

[flavor]
dark = "tokyo-night"
