# =====================================================================
#  Yazi 主題
#  搭配 WezTerm 的 Tokyo Night（#1a1b26）。
#
#  此 flavor 不影響 WezTerm 的透明背景：
#    WezTerm 設定了 window_background_opacity = 0.90，
#    而 tokyo-night 的主檔案區（mgr）皆使用 bg = "reset"，即不繪製背景，
#    直接顯示終端機背景，因此透明效果完整保留。
#    只有分頁標籤與進度條使用不透明背景（#292e42 / #7aa2f7），
#    與 WezTerm 分頁列使用相同的藍色。
#
#  只設定 dark：WezTerm 為深色背景，不需要 light。
#  （flavor README 中的 use = "..." 是 Yazi 0.4 以前的舊設定鍵，本機 26.5.6 不需要。）
# =====================================================================

[flavor]
dark = "tokyo-night"
