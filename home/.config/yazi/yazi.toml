# =====================================================================
#  Yazi 主設定（主要用於 Windows，與 WSL 共用）
#  openers 以 for = "windows" / "unix" 區分，WSL 中以 ln -s 連結此目錄即可使用。
#  未列出的項目皆沿用 yazi 預設值：
#    https://github.com/sxyazi/yazi/blob/main/yazi-config/preset/
#
#  各設定的調查過程與原始碼依據：docs/yazi.md（repo 內，不會部署）。
#  修改本檔後請跑 .\check.ps1：任一值不合法時，yazi 會把整組設定
#  （包括 keymap.toml）退回預設值，症狀只是自訂鍵位全部失效。
# =====================================================================

# ---------------------------------------------------------------------
# 預覽品質
# ---------------------------------------------------------------------
# 預設 600x900、q75 在本機螢幕上會被放大，壓縮痕跡明顯；這兩個上限也是
#   T（預覽全寬）時的實際畫質上限。image_filter 維持 triangle，見 docs。
# image_delay 必須隨畫質一併調高，否則按住方向鍵捲動相簿會卡頓。
#   有效範圍 0～100（官方文件未載明），超出會讓整組設定退回預設。
[preview]
max_width     = 1200
max_height    = 1600
image_quality = 90
image_delay   = 100

# ---------------------------------------------------------------------
# 開啟方式
# ---------------------------------------------------------------------
# 只覆寫 edit；reveal、extract、trash 等皆沿用預設值。
[opener]
# 第一條是 Enter 與 o 的預設；nvim 排最後，按 O 從選單選。
#
# 順序不可調換：批次重新命名（多選後按 r）使用第一條 block = true 的規則，
#   nvim 排在 subl -w 之前會讓批次重新命名改用 nvim，而 Enter 看起來不變。
# nvim 必須 block = true：它是 TUI，設為 orphan 會與 yazi 爭用畫面。
#
# if defined NVIM：從 nvim（\y）開的 yazi 中按 O 選 nvim 時，改由外層 nvim 開檔，
#   避免在浮動視窗裡再開一個 nvim（swap 衝突 E325）。原理見 docs。
# desc 必須明寫 "nvim"，否則選單會顯示 run 的第一個字 "if"。
edit = [
	{ run = 'subl %s',          desc = "subl",         for = "windows", orphan = true },
	{ run = 'subl -w %s',       desc = "subl (block)", for = "windows", block  = true },
	{ run = 'if defined NVIM (ya emit open) else nvim %s',
	                            desc = "nvim",         for = "windows", block  = true },
	{ run = '${EDITOR:-vi} %s', desc = "$EDITOR",      for = "unix",    block  = true },
]

# ---------------------------------------------------------------------
# 外掛：fetcher 註冊
# ---------------------------------------------------------------------
# 外掛 README 中的 id 欄位只有 v26.1.22 以前需要，此處一律省略。

# mime-ext：以副檔名判斷檔案類型。Windows 沒有 file(1)，可省去讀檔頭的 I/O，
#   在 \\wsl.localhost 上差異尤其明顯。代價是副檔名與內容不符的檔案會誤判。
[[plugin.prepend_fetchers]]
url   = "local://*"
run   = "mime-ext.local"
prio  = "high"
group = "mime"

[[plugin.prepend_fetchers]]
url   = "remote://*"
run   = "mime-ext.remote"
prio  = "high"
group = "mime"

# git：以 linemode 顯示 git 狀態。非同步執行，大型 repo 中只會讓圖示晚一點出現。
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
