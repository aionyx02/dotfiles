"$schema" = 'https://starship.rs/config-schema.json'

# ★優化3:每次指令完畢後,下一個提示字元上方自動空一行,避免 Error Log 與提示字元黏在一起
add_newline = true

# 冷色開發者配色(石板灰 → 藍 → 綠 → 青 → 蔚藍 → 深灰),與 WezTerm 的 Catppuccin Mocha 呼應
# ★ 想換色只要改各段的 bg 十六進位色碼,並記得把下面 format 裡對應的箭頭顏色一起換
format = """
[](#45475a)\
$os\
$username\
[](bg:#89b4fa fg:#45475a)\
$directory\
[](fg:#89b4fa bg:#a6e3a1)\
$git_branch\
$git_status\
[](fg:#a6e3a1 bg:#74c7ec)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$maven\
$nodejs\
$bun\
$nim\
$rust\
$scala\
[](fg:#74c7ec bg:#94e2d5)\
$docker_context\
[](fg:#94e2d5 bg:#313244)\
$time\
[ ](fg:#313244)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

[username]
show_always = true
style_user = "fg:#cdd6f4 bg:#45475a"
style_root = "fg:#f38ba8 bg:#45475a"
format = '[ $user ]($style)'
disabled = false

[os]
style = "fg:#cdd6f4 bg:#45475a"
disabled = true # Disabled by default

[directory]
style = "fg:#11111b bg:#89b4fa"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[c]
symbol = " "
style = "fg:#11111b bg:#74c7ec"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "fg:#11111b bg:#74c7ec"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "fg:#11111b bg:#94e2d5"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "fg:#11111b bg:#74c7ec"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "fg:#11111b bg:#74c7ec"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "fg:#11111b bg:#a6e3a1"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:#11111b bg:#a6e3a1"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "fg:#11111b bg:#74c7ec"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "fg:#11111b bg:#74c7ec"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "fg:#11111b bg:#74c7ec"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "fg:#11111b bg:#74c7ec"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "fg:#11111b bg:#74c7ec"
format = '[ $symbol ($version) ]($style)'

[maven]
style = "fg:#11111b bg:#74c7ec"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "fg:#11111b bg:#74c7ec"
format = '[ $symbol ($version) ]($style)'

[bun]
symbol = ""
style = "fg:#11111b bg:#74c7ec"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "fg:#11111b bg:#74c7ec"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "fg:#11111b bg:#74c7ec"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "fg:#11111b bg:#74c7ec"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "fg:#cdd6f4 bg:#313244"
format = '[  $time ]($style)'
